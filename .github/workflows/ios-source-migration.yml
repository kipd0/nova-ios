name: One-shot Nova iOS patch-to-source migration
on:
  push:
    branches: [test-touch-screen]
    paths:
      - '.github/scripts/migrate_ios_patches.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nova-ios-source-migration
  cancel-in-progress: false

jobs:
  bake-ios-source:
    if: github.ref == 'refs/heads/test-touch-screen'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply the exact CI patch sequence and push tracked source
        run: python3 .github/scripts/migrate_ios_patches.py
